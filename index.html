<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    Content Security Policy: scripts and styles only from this site, network
    calls only to the model providers SWAiRM supports. Even if a model's
    answer contained markup, it could neither run code nor send data anywhere.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://openrouter.ai https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.mistral.ai https://api.x.ai https://router.huggingface.co; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b1e">
  <meta name="description" content="SWAiRM — build the right AI team for every task. Describe a goal, get a team of agents and models, run it with your own API keys.">
  <title>SWAiRM — Build the right AI team for every task</title>
  <link rel="icon" href="assets/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <noscript><p class="noscript">SWAiRM runs entirely in your browser and needs JavaScript.</p></noscript>
</body>
</html>
