name: Deploy to GitHub Pages

# The site is the repository as it is: no build step. Before the first deploy,
# set Settings → Pages → Source to "GitHub Actions" — otherwise this workflow
# runs green and no site appears.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests before publishing
        run: node --test tests/*.test.mjs
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest .nojekyll assets js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
